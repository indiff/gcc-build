name: GCC Matrix Build

on:
#   push:
#     branches: [main]
#     paths:
#       - 'build-gcc.sh'
#       - 'Dockerfile.gcc'
#       - '.github/workflows/build-gcc.yml'
  # schedule:
  #   - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      gcc_ref:
        description: 'GCC git ref (branch, tag, or commit)'
        required: false
        default: 'master'
        type: string
      jobs:
        description: 'Parallel make jobs per container (blank = nproc)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: gcc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GCC_REF: ${{ inputs.gcc_ref || 'master' }}
  BUILD_JOBS: ${{ inputs.jobs || '' }}

jobs:
  build-gcc:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include:
           - { os: ubuntu,       image: ubuntu:24.04, arch: x86,  docker_arch: amd64 }
           # - { os: ubuntu,       image: ubuntu:24.04, arch: arm,  docker_arch: arm64 }
           #- { os: oraclelinux7, image: oraclelinux:7, arch: x86,  docker_arch: amd64 }
           #- { os: oraclelinux7, image: oraclelinux:7, arch: arm,  docker_arch: arm64 }
           #- { os: oraclelinux8, image: oraclelinux:8, arch: x86,  docker_arch: amd64 }
           #- { os: oraclelinux8, image: oraclelinux:8, arch: arm,  docker_arch: arm64 }
           - { os: oraclelinux9, image: oraclelinux:9, arch: x86,  docker_arch: amd64 }
           # - { os: oraclelinux9, image: oraclelinux:9, arch: arm,  docker_arch: arm64 }    
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build GCC builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.gcc
          platforms: linux/${{ matrix.docker_arch }}
          build-args: BASE_IMAGE=${{ matrix.image }}
          tags: gcc-builder:${{ matrix.os }}-${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=gcc-${{ matrix.os }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gcc-${{ matrix.os }}-${{ matrix.arch }}

      - name: Build GCC
        env:
          GCC_REF: ${{ env.GCC_REF }}
          BUILD_JOBS: ${{ env.BUILD_JOBS }}
        run: |
          mkdir -p artifacts
          args=(
            --arch "${{ matrix.arch }}"
            --os "${{ matrix.os }}"
            --ref "$GCC_REF"
            --output-dir /artifacts
          )
          if [[ -n "$BUILD_JOBS" ]]; then
            args+=(--jobs "$BUILD_JOBS")
          fi
          docker run --rm \
            --platform "linux/${{ matrix.docker_arch }}" \
            -e GCC_REF \
            -e BUILD_JOBS \
            -v "$PWD/artifacts:/artifacts" \
            gcc-builder:${{ matrix.os }}-${{ matrix.arch }} \
            "${args[@]}"

      - name: Upload GCC artifact
        uses: actions/upload-artifact@v7
        with:
          name: gcc-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Create Release
        id: create_release
        run: |
          set -xeuo pipefail
          # ========== 1. 获取 GCC 版本与提交信息 ==========
          curl --retry 3 --max-time 10 -sLo ver \
            "https://github.com/gcc-mirror/gcc/raw/refs/heads/master/gcc/BASE-VER"
          GCC_VERSION="$(cat ver)"
          echo "gcc_version=${GCC_VERSION}" >> "$GITHUB_OUTPUT"

          # 修复续行语法，所有换行结尾加 \，管道不单独起行
          commit_info=$(curl -sf -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/gcc-mirror/gcc/commits?per_page=1" \
            | jq -r '.[0] | "\(.commit.author.name) | \(.commit.message | split("\n")[0]) | \(.commit.author.date)"')
          # 兜底：api限流/返回空时填充占位文本
          if [[ -z "${commit_info}" || "${commit_info}" == "null" ]]; then
              commit_info="unknown | fetch commit info failed | $(date -u)"
          fi
          echo "Commit Info: ${commit_info}"

          # ========== 2. 生成 Release Tag ==========
          TAG_NAME="gcc-${GCC_VERSION}-$(date -u +%Y%m%d)"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          # ========== 3. 在正确的 artifacts 目录中查找产物 ==========
          ARTIFACT_DIR="./artifacts"
          gcc_pkgpath=""
          gcc_pkgpath="$(find "${ARTIFACT_DIR}" -type f -name 'gcc-*.tar.xz' ! -name 'lld-*' | head -n 1)" || true
          if [[ -z "${gcc_pkgpath}" ]]; then
            gcc_pkgpath="$(find "${ARTIFACT_DIR}" -type f -name 'gcc-*.zip' ! -name 'lld-*' | head -n 1)" || true
          fi
          if [[ -z "${gcc_pkgpath}" ]]; then
            echo '::error::未找到任何 GCC 打包文件 (gcc-*.tar.xz / gcc-*.zip)' >&2
            ls -laR "${ARTIFACT_DIR}" >&2 || true
            exit 1
          fi
          gcc_bname="$(basename "${gcc_pkgpath}")"
          echo "Found GCC package: ${gcc_bname}"

          lld_pkgpath=""
          lld_bname=""
          lld_pkgpath="$(find "${ARTIFACT_DIR}" -type f -name 'lld-*.tar.xz' | head -n 1)" || true
          if [[ -z "${lld_pkgpath}" ]]; then
            lld_pkgpath="$(find "${ARTIFACT_DIR}" -type f -name 'lld-*.zip' | head -n 1)" || true
          fi
          if [[ -n "${lld_pkgpath}" ]]; then
            lld_bname="$(basename "${lld_pkgpath}")"
            echo "Found LLD package: ${lld_bname}"
          fi

          # ========== 4. 生成 Release Notes ==========
          cat > hello.md <<EOF
          ## GCC ${GCC_VERSION} Build ($(date -u +%Y-%m-%d))
          > **Latest upstream commit:** ${commit_info}
          ### GCC Package (\`${gcc_bname}\`)
          Proxy download:
          \`\`\`bash
          curl -#Lo gcc-indiff.tar.xz "https://ghfast.top/https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${gcc_bname}"
          \`\`\`
          Direct download:
          \`\`\`bash
          curl -#Lo gcc-indiff.tar.xz "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${gcc_bname}"
          \`\`\`
          EOF
                    if [[ -n "${lld_bname}" ]]; then
                      cat >> hello.md <<EOF
          ### LLD Package (\`${lld_bname}\`)
          Proxy download:
          \`\`\`bash
          curl -#Lo lld-indiff.tar.xz "https://ghfast.top/https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${lld_bname}"
          \`\`\`
          Direct download:
          \`\`\`bash
          curl -#Lo lld-indiff.tar.xz "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${lld_bname}"
          \`\`\`
          EOF
          fi

          # ========== 5. 创建 Release ==========
          release_args=(
            create
            "${TAG_NAME}"
            --title "GCC ${GCC_VERSION} (${TAG_NAME})"
            --clobber
            -F hello.md
            "${gcc_pkgpath}"
          )
          if [[ -n "${lld_pkgpath}" ]]; then
            release_args+=("${lld_pkgpath}")
          fi
          gh release "${release_args[@]}"

          # 清理临时文件
          rm -f ver hello.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
